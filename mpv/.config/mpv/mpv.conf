# ---------------------------
# gpu / hw acceleration
# ---------------------------
vo=gpu
hwdec=vaapi
gpu-context=wayland
profile=gpu-hq
ytdl=yes
script-opts=ytdl_hook-ytdl_path=/usr/bin/yt-dlp
# ---------------------------
# color & hdr
# ---------------------------
tone-mapping=hable
tone-mapping-param=0.8
gamut-mapping-mode=warn
hdr-compute-peak=yes
target-peak=1000
icc-profile-auto=yes
save-position-on-quit=yes
# ---------------------------
# scaling (sharper video)
# ---------------------------
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
tscale=oversample

# ---------------------------
# high quality video
# ---------------------------
interpolation=yes
video-sync=display-resample
blend-subtitles=yes


# audio
# ---------------------------
ao=pipewire,pulse
audio-device=auto
audio-fallback-to-null=no
af=lavfi=[loudnorm]
volume-max=200
audio-device=pipewire/alsa_output.pci-0000_00_1f.3.analog-stereo
