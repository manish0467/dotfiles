# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, Q, qutebrowser, exec, omarchy-launch-or-focus "^org.qutebrowser.qutebrowser$" "uwsm-app -- qutebrowser"
bindd = SUPER SHIFT, C, VS Code, exec, omarchy-launch-or-focus "^code$" "uwsm-app -- code"
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Spotify, exec, uwsm-app -- xdg-terminal-exec spotify_player
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, N, Notion, exec, omarchy-launch-or-focus "^Notion$" "uwsm-app -- notion-app"
bindd = SUPER SHIFT ALT, R, Foliate, exec, omarchy-launch-or-focus "^com.github.johnfactotum.Foliate$" "uwsm-app -- foliate"
# bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
# bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"



# Scripts/Terminal-related Bindings
bindd = SUPER SHIFT, I, ISL, exec, ~/.config/hypr/scripts/open_isl_live.sh
bindd = SUPER SHIFT, E, Entertainment, exec, uwsm-app -- bash -lc "$HOME/.local/bin/play-video"
bindd = SUPER SHIFT, L, dmenunotes, exec, ~/.local/bin/dmenunotes
bindd = SUPER SHIFT, R, rmpc, exec, omarchy-launch-tui rmpc
bindd = SUPER SHIFT, Z, Yazi File Manager, exec, uwsm-app -- xdg-terminal-exec -- yazi
bindd = SUPER SHIFT, V, Neovim, exec, uwsm-app -- xdg-terminal-exec -- nvim
bindd = SUPER SHIFT, W, WiFi, exec, omarchy-launch-wifi
bindd = SUPER SHIFT, S, Sound, exec, ~/.local/bin/audio-toggle
bindd = SUPER SHIFT ALT, D, Launcher (tofi), exec, ~/.local/bin/tofi-launcher.sh
# Rofi launchers
unbind = SUPER, SPACE
bindd = SUPER, SPACE, App launcher (rofi), exec, uwsm-app -- ~/.local/bin/rofi-launcher
bindd = SUPER ALT, T, Theme picker (rofi), exec, uwsm-app -- ~/.local/bin/rofi-theme-picker
bindd = SUPER ALT, W, Window switcher (rofi), exec, uwsm-app -- ~/.local/bin/rofi-windows
bindd = SUPER SHIFT ALT, A, Athletics, exec, /home/alen/baseball_game.sh
bindd = SUPER SHIFT, A, Rmusic, exec, ~/.local/bin/mpd-search-play
bindd = SUPER SHIFT, P, MPD Play/Pause, exec, mpc toggle
bindd = SUPER SHIFT, H, MPD Next, exec,  ~/.local/bin/mpd-track-skip.sh
bindd = SUPER SHIFT, G, MPD Previuos, exec, mpc prev
bindd = SUPER SHIFT, X, MPD Stop, exec, mpc clear
bindd = SUPER SHIFT, D, Add to Queue, exec, ~/.local/bin/mpd-queue-add
bindd = SUPER SHIFT ALT, Z, zed, exec, uwsm-app -- gtk-launch dev.zed.Zed
# Sports Launcher v3
bindd = SUPER SHIFT ALT, M, MLB Live,      exec, sports mlb
bindd = SUPER SHIFT ALT, S, MLB Popup,     exec, sports popup
bindd = SUPER SHIFT ALT, L, Sports Menu,   exec, sports
bindd = SUPER SHIFT ALT, T, Sports Dashboard, exec, sports dashboard


