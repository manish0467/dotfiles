# System Bindings(Power Menu, Lock, Logout, Reboot, Shutdown):Manually created power menu script

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

unbind = SUPER,ESCAPE
bindd = SUPER,ESCAPE, Power menu (custom), exec, ~/.config/hypr/scripts/custom-powermenu.sh


